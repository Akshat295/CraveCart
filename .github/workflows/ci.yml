name: CraveCart CI

on:
  push:
    branches:
      - main

jobs:

  docker:

    runs-on: ubuntu-latest

    steps:

    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build Backend Image
      run: |
        docker build -t akshatjohri/cravecart-backend:latest ./backend

    - name: Push Backend Image
      run: |
        docker push akshatjohri/cravecart-backend:latest

    - name: Build Frontend Image
      run: |
        docker build -t akshatjohri/cravecart-frontend:latest ./frontend

    - name: Push Frontend Image
      run: |
        docker push akshatjohri/cravecart-frontend:latest